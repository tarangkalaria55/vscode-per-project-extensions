# Publishes pushed v* tags on main to the VS Code Marketplace; a version that is already published is skipped.
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension
# Requires a VSCE_PAT repo secret: an Azure DevOps PAT for "All accessible organizations" with the Marketplace > Manage scope.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  # GitHub can't require both a tag and a branch in the trigger, so check here that the tagged commit is on main.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  publish:
    needs: on-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Never publish a build whose tests fail; VS Code needs xvfb for a display on Linux.
      - run: xvfb-run -a npm test
      - run: npx vsce publish --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
