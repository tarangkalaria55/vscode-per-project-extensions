# Publishes the .vsix that CI built to the VS Code Marketplace; a version that is already published is skipped.
# Called by ci.yml only after tests pass on every OS, so it never runs on its own.
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension
# Requires a VSCE_PAT repo secret: an Azure DevOps PAT for "All accessible organizations" with the Marketplace > Manage scope.
name: Publish

on:
  workflow_call:
    secrets:
      VSCE_PAT:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: vsix
      - run: npx vsce publish --skip-duplicate --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
