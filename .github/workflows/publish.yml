# Publishes pushes to main to the VS Code Marketplace; a push that doesn't bump the version in package.json is skipped.
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension
# Requires a VSCE_PAT repo secret: an Azure DevOps PAT for "All accessible organizations" with the Marketplace > Manage scope.
name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Never publish a build whose tests fail; VS Code needs xvfb for a display on Linux.
      - run: xvfb-run -a npm test
      - run: npx vsce publish --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
