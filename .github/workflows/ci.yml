# Tests on every OS and uploads the .vsix.
# https://code.visualstudio.com/api/working-with-extensions/continuous-integration
# Runs only for pushed v* tags on main; publishing is done by publish.yml.
name: CI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # GitHub can't require both a tag and a branch in the trigger, so check here that the tagged commit is on main.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  build:
    needs: on-main
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # VS Code needs a display; xvfb provides one on headless Linux.
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - run: npm run vsix
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: '*.vsix'
